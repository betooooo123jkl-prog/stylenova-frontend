<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleNova | AI Fashion & Beauty</title>
    <!-- Aquí conectamos el diseño visual que haremos en el siguiente paso -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>StyleNova <span>AI</span></h1>
            <p>Tu asesor de belleza, moda y cabello</p>
        </header>
        
        <!-- Área donde aparecerán los mensajes -->
        <div class="chat-box" id="chat-box">
            <div class="message bot">
                <div class="bubble">Hola, soy StyleNova. ¿En qué puedo ayudarte hoy con tu estilo, maquillaje o cabello?</div>
            </div>
        </div>
        
        <!-- Área para escribir y enviar mensajes -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Pregúntame sobre un outfit o rutina..." autocomplete="off">
            <button id="send-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
        </div>
    </div>
    
    <!-- Aquí conectamos la lógica que haremos al final -->
    <script src="script.js"></script>
</body>
</html>
